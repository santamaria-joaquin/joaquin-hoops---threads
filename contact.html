<!DOCTYPE html>
<html>
<head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Joaquin's Hoops & Threads</title>
  <style>
       * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #f5f7fa; color: #2d3748; line-height: 1.6; }
    header { background: linear-gradient(135deg, #1a202c, #2d3748); color: white; padding: 25px; text-align: center; }
    nav ul { list-style: none; margin-top: 12px; }
    nav li { display: inline-block; margin: 0 12px; }
    nav a { color: #90cdf4; text-decoration: none; font-weight: 600; }
    nav a:hover { color: #f6e05e; }
    main { max-width: 800px; margin: 30px auto; padding: 0 20px; }
    h2 { color: #2d3748; border-bottom: 2px solid #e2e8f0; padding-bottom: 6px; margin-bottom: 20px; text-align: center; }
    ul { list-style: none; margin-top: 10px; padding: 0; }
    li { padding: 12px; margin: 8px 0; background: #e2e8f0; border-radius: 8px; border-left: 4px solid #2b6cb0; }
    footer { text-align: center; padding: 18px; color: #718096; font-size: 0.9em; margin-top: 30px; }
  </style>
</head>
<body>

<header>
    <h2>📍 My Shop</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>
    <h1>Get In Touch</h1>
    <p>Have questions or suggestions? Feel free to reach out!</p>
  
    <form>
        <fieldset>
            <legend>Your details</legend>

            <div>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div>
                <label for="subject">Subject</label>
                <select id="subject" name="subject" required>
                    <option value="">— Select a topic —</option>
                    <option value="general">General Inquiry</option>
                    <option value="feedback">Feedback & Suggestions</option>
                    <option value="collaboration">Collaboration / Partnership</option>
                    <option value="other">Something Else</option>
                </select>
            </div>

            <div>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>

            <button type="submit">Send message</button>
        </fieldset>
    </form>

</main>

<footer>
    <p>© 2026 My Guide Site — All Rights Reserved</p>
</footer>

</body>
</html>
